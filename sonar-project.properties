sonar.organization=headlesstarry
sonar.projectKey=HeadlessTarry_Token-Tinkering

sonar.sources=run_checks.sh,setup_dev_env.sh,scripts,overhaul-mods,.claude-plugin
sonar.exclusions=scripts/tests/**,overhaul-mods/*/mods/*/tests/**
sonar.tests=scripts/tests,overhaul-mods
sonar.test.inclusions=scripts/tests/**,overhaul-mods/*/mods/*/tests/**
sonar.javascript.lcov.reportPaths=lcov.info

# `claude plugin test` reports no coverage, so the mods are left out of the coverage measure.
sonar.coverage.exclusions=overhaul-mods/**

# The output parsers strip ANSI escapes and control characters on purpose (the same reason as the Biome override).
sonar.issue.ignore.multicriteria=controlchars
sonar.issue.ignore.multicriteria.controlchars.ruleKey=typescript:S6324
sonar.issue.ignore.multicriteria.controlchars.resourceKey=overhaul-mods/**/model.ts
